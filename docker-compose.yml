services:
  media-downloader:
    build: .
    container_name: media-downloader
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      # Tiempos ajustables (segundos)
      EXTRACT_TIMEOUT: "60"
      PROXY_TIMEOUT: "300"
      # Ruta del cookies.txt (auth/config, no media). Instagram casi siempre
      # lo requiere. Se sube desde la web (botón Cookies) o se monta manualmente.
      # Un ÚNICO cookies.txt Netscape con varios dominios (instagram.com, x.com,
      # twitter.com, ...) sirve para todos esos sitios a la vez.
      COOKIES_FILE: /data/cookies.txt
      # Opcional: UA del navegador origen de las cookies. Instagram a veces
      # rechaza cookies si el UA no coincide. Copia el de tu navegador.
      # GALLERY_DL_UA: "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"
      # --- Refresh automático de sesión de Instagram (Playwright, Opción A+D) ---
      # storage_state de Playwright (cookies+localStorage) persistido en /data.
      # Renueva la sesión en Chromium sin re-login; se crea en el primer refresco.
      PLAYWRIGHT_STATE_FILE: /data/playwright_state.json
      # Auto-refresh silencioso al fallar un extract de IG con "redirect to login".
      # "1" (defecto) = activado; "0" = desactivado (vuelve al comportamiento solo-cookies).
      INSTAGRAM_AUTO_REFRESH: "1"
      # Credenciales OPCIONALES para re-login silencioso cuando la sesión muere
      # del todo. Si NO las fijas, el re-login se pide UNA vez por la web (UI 2FA).
      # Mismo nivel de acceso que cookies.txt; el contenedor las lee de este env.
      # INSTAGRAM_USERNAME: "tu_usuario"
      # INSTAGRAM_PASSWORD: "tu_password"
    volumes:
      # Persiste las cookies subidas desde la web entre reinicios.
      - ./data:/data
      # ALTERNATIVA SIN WEB: pon tu cookies.txt junto a este docker-compose.yml y
      # monta read-only. Así no hace falta subir nada desde el móvil/PC. El botón
      # 🍪 de la web entonces avisará de que es read-only (edítalo en el host).
      # - ./cookies.txt:/data/cookies.txt:ro